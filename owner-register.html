<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EarthLink | Owner Registration</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6f2;
}

.container{
    width:90%;
    max-width:500px;
    margin:40px auto;
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

.logo{
    text-align:center;
    font-size:32px;
    font-weight:bold;
    color:#2E7D32;
}

.logo span{
    color:#6D4C41;
}

h2{
    text-align:center;
    margin:20px 0;
    color:#333;
}

label{
    font-weight:bold;
    display:block;
    margin-top:15px;
}

input,select{
    width:100%;
    padding:12px;
    margin-top:8px;
    border:1px solid #ccc;
    border-radius:10px;
}

button{
    width:100%;
    margin-top:25px;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#2E7D32;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#1B5E20;
}

.note{
    text-align:center;
    margin-top:15px;
    font-size:13px;
    color:gray;
}

</style>

</head>

<body>

<div class="container">

<div class="logo">
EARTH<span>LINK</span>
</div>

<h2>Equipment Owner Registration</h2>


<form>

<label>Owner Name</label>
<input type="text" placeholder="Enter your name">


<label>Mobile Number</label>
<input type="number" placeholder="Enter mobile number">


<label>Email</label>
<input type="email" placeholder="Enter email">


<label>Location</label>
<input type="text" placeholder="City / District">


<label>Equipment Type</label>

<select>
<option>Select Equipment</option>
<option>JCB Backhoe Loader</option>
<option>Tractor</option>
<option>Tipper</option>
<option>Crane</option>
<option>Excavator</option>
<option>Harvester</option>
</select>


<label>Vehicle Number</label>
<input type="text" placeholder="TN XX XX XXXX">


<label>Experience</label>

<select>
<option>Select Years</option>
<option>0-2 Years</option>
<option>3-5 Years</option>
<option>5+ Years</option>
</select>


<label>Available Timing</label>
<input type="text" placeholder="Eg: 9 AM - 6 PM">


<label>Upload RC / Document</label>
<input type="file">


<button>
Register as Owner
</button>


</form>


<div class="note">
EarthLink connects equipment owners with customers
</div>


</div>

</body>
</html>

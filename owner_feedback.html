<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EarthLink Owner Feedback</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}


body{
    background:#f3f5f1;
}


.container{

    width:90%;
    max-width:550px;
    margin:40px auto;
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0px 5px 20px rgba(0,0,0,0.1);

}


.logo{

    text-align:center;
    font-size:32px;
    font-weight:bold;
    color:#2E7D32;

}


.logo span{

    color:#6D4C41;

}


h2{

    text-align:center;
    margin:20px 0;
    color:#333;

}


p{

    text-align:center;
    color:gray;
    font-size:14px;

}


label{

    font-weight:bold;
    display:block;
    margin-top:18px;

}


input,select,textarea{

    width:100%;
    padding:12px;
    margin-top:8px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:15px;

}


textarea{

    height:100px;
    resize:none;

}


.radio{

    margin-top:10px;

}


button{

    width:100%;
    padding:14px;
    margin-top:25px;
    border:none;
    border-radius:12px;
    background:#2E7D32;
    color:white;
    font-size:18px;
    cursor:pointer;

}


button:hover{

    background:#1B5E20;

}


</style>


</head>


<body>


<div class="container">


<div class="logo">
EARTH<span>LINK</span>
</div>


<h2>Owner Feedback Survey</h2>

<p>
Help us understand equipment owners' challenges
</p>



<form>


<label>Your Name (Optional)</label>
<input type="text" placeholder="Enter your name">



<label>Equipment Type</label>

<select>

<option>Select Equipment</option>
<option>JCB</option>
<option>Tractor</option>
<option>Tipper</option>
<option>Crane</option>
<option>Excavator</option>
<option>Harvester</option>

</select>




<label>Your Location</label>

<input type="text" placeholder="District / Village">





<label>How do you currently get customers?</label>

<textarea placeholder="Example: Direct contacts, contractors, brokers..."></textarea>





<label>What problems do you face as an equipment owner?</label>

<textarea placeholder="Example:
• Finding customers
• Low machine usage
• Payment delays
• Broker commission
• Maintenance cost"></textarea>






<label>How many days your equipment stays idle in a month?</label>

<select>

<option>Select</option>
<option>1-5 Days</option>
<option>5-15 Days</option>
<option>15+ Days</option>

</select>






<label>Do you think an app like EarthLink will help?</label>


<div class="radio">

<input type="radio" name="help"> Yes

<input type="radio" name="help"> No

<input type="radio" name="help"> Maybe

</div>





<label>What features do you expect from EarthLink?</label>

<textarea placeholder="Example:
• More bookings
• Online payment
• Location based customers
• Equipment tracking"></textarea>






<label>Any Suggestions?</label>

<textarea placeholder="Your valuable feedback"></textarea>





<button>
Submit Feedback
</button>



</form>


</div>


</body>

</html>

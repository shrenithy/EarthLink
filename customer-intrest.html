<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EarthLink - Customer Interest Form</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#f4f7f4;
display:flex;
justify-content:center;
padding:30px;
}

.container{
background:white;
max-width:700px;
width:100%;
padding:35px;
border-radius:18px;
box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

h1{
color:#2E7D32;
text-align:center;
margin-bottom:10px;
}

.subtitle{
text-align:center;
color:#666;
margin-bottom:30px;
}

label{
display:block;
margin-top:18px;
margin-bottom:6px;
font-weight:600;
}

input,select,textarea{
width:100%;
padding:14px;
border:1px solid #ccc;
border-radius:10px;
font-size:15px;
}

textarea{
height:120px;
resize:none;
}

button{
margin-top:30px;
width:100%;
padding:16px;
background:#2E7D32;
color:white;
font-size:17px;
border:none;
border-radius:10px;
cursor:pointer;
}

button:hover{
background:#256628;
}

.note{
margin-top:20px;
text-align:center;
font-size:13px;
color:#777;
}

</style>

</head>

<body>

<div class="container">

<h1>🌍 EarthLink</h1>

<p class="subtitle">
Help us build Tamil Nadu's Heavy Equipment Booking Platform.
</p>

<form>

<label>Full Name</label>
<input type="text" placeholder="Enter your name">

<label>Mobile Number</label>
<input type="tel" placeholder="10-digit mobile number">

<label>District</label>
<input type="text" placeholder="Example: Chennai">

<label>Village / City</label>
<input type="text">

<label>You are a</label>

<select>
<option>Farmer</option>
<option>House Owner</option>
<option>Contractor</option>
<option>Builder</option>
<option>Real Estate Developer</option>
<option>Other</option>
</select>

<label>Which equipment do you need?</label>

<select>
<option>JCB</option>
<option>Tipper</option>
<option>Tractor</option>
<option>Crane</option>
<option>Excavator</option>
<option>Road Roller</option>
<option>Bulldozer</option>
<option>Other</option>
</select>

<label>How often do you rent equipment?</label>

<select>
<option>Weekly</option>
<option>Monthly</option>
<option>Few times a year</option>
<option>First Time</option>
</select>

<label>How do you currently find equipment?</label>

<select>
<option>Phone Calls</option>
<option>Friends / Relatives</option>
<option>Local Agent</option>
<option>Google</option>
<option>Other</option>
</select>

<label>What is your biggest problem while booking equipment?</label>

<textarea placeholder="Tell us your biggest challenge..."></textarea>

<label>Would you use EarthLink when we launch?</label>

<select>
<option>Definitely Yes</option>
<option>Maybe</option>
<option>No</option>
</select>

<button type="submit">
Submit Interest
</button>

</form>

<div class="note">

Thank you ❤️ Your feedback helps us build a better platform.

</div>

</div>

</body>
</html>
